name: Validate Process Tree Lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Run Python contracts
        run: python3 -m unittest tools.process_tree.test_app_contracts tools.process_tree.test_verify_and_package -q

      - name: Run JavaScript contracts
        run: node tools/process_tree/test_process_tree_editor.js

      - name: Check JavaScript syntax
        run: node --check apps/spl_process_tree_lab/appserver/static/js/process_tree_104.js

      - name: Run optimized package verifier
        run: python3 -O tools/process_tree/verify_and_package.py
